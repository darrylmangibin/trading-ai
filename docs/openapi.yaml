openapi: 3.0.3
info:
  title: Trading API
  version: 0.0.1
  description: Initial NestJS API contract.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check that the API process is responding
      description: Liveness only; does not check databases or external services.
      security: []
      responses:
        "200":
          description: The API process is responding.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [trading-api]
              example:
                status: ok
                service: trading-api
